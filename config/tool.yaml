# Description of the tool being identified.
#
# Everything here is a PRIOR or a VALIDATION reference -- none of it is used as ground
# truth by the estimator, except `mass_scale` which optionally enters Stage A as a
# constraint. Fill in the real numbers before running on hardware.

name: "belt_gripper"

# Independent mass measurement [kg]. A 0.1 g kitchen scale is plenty. This is the
# single strongest validation check available, and it decorrelates m from m*c_z in
# Stage A. Set to null if unavailable.
mass_scale: 0.62
mass_scale_tolerance: 0.1     # relative; Stage A constrains m to mass_scale*(1 +- this)
use_mass_constraint: true

# Axis-aligned bounding box of the tool in the FLANGE frame [m].
# Used for three things:
#   1. the bounding-sphere entry appended to workspace.yaml monitored_points,
#   2. the uniform-density prior inertia phi_0 / J_0 for the entropic regulariser,
#   3. the bounding-ellipsoid LMI constraint in Stage B.
bounding_box:
  min: [-0.09, -0.09, 0.00]
  max: [ 0.09,  0.09, 0.25]

# Optional CAD estimate. If given, it overrides the uniform-density bounding-box prior.
# com is w.r.t. the flange origin, inertia is about the CoM in flange axes.
cad:
  mass: null
  com: null                    # [x, y, z] in m
  inertia: null                # [[ixx,ixy,ixz],[ixy,iyy,iyz],[ixz,iyz,izz]] kg m^2
